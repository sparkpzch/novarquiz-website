# apphosting.yaml

# Cloud Run service configuration
runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 100
  concurrency: 80

# Environment variables
env:
  # Secrets (sensitive — stored in Secret Manager)
  - variable: DATABASE_URL
    secret: DATABASE_URL
  - variable: SESSION_SECRET
    secret: SESSION_SECRET
  - variable: MUX_TOKEN_ID
    secret: MUX_TOKEN_ID
  - variable: MUX_TOKEN_SECRET
    secret: MUX_TOKEN_SECRET
  - variable: MUX_WEBHOOK_SECRET
    secret: MUX_WEBHOOK_SECRET
  - variable: DB_PROVIDER
    value: neon
  - variable: NEXT_PUBLIC_APP_ORIGIN
    value: https://novarquiz-website--novartis-decisionlab.us-east4.hosted.app

  # Firebase client config (public — safe to hardcode)
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyB-8MugkLtJSYfQ0gVU02jWKr00bjOiC4E
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: novartis-decisionlab.firebaseapp.com
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: novartis-decisionlab
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: novartis-decisionlab.firebasestorage.app
