# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  # Keep one warm instance: a cold start adds ~3s to the first request.
  minInstances: 1
  maxInstances: 4
  concurrency: 80
  cpu: 1
  memoryMiB: 512

# Environment variables and secrets.
env:
  - variable: VIDEO_PROCESSING_JOB
    value: "projects/novartis-decisionlab/locations/asia-southeast1/jobs/novarquiz-video-worker"
    availability: [RUNTIME]
  # Browser-facing origin for CSRF checks; request.url may use Cloud Run's host.
  - variable: APP_ORIGIN
    value: "https://novarquiz-website-sg--novartis-decisionlab.asia-southeast1.hosted.app"
    availability:
      - RUNTIME
  - variable: TRUST_PROXY
    value: "1"
    availability:
      - RUNTIME
  # Rate limiting (lib/ratelimit.ts). Without these the limiter silently falls
  # back to a per-instance Map, which maxInstances > 1 and minInstances: 0
  # between them make close to meaningless.
  - variable: UPSTASH_REDIS_REST_URL
    secret: UPSTASH_REDIS_REST_URL
    availability:
      - RUNTIME
  - variable: UPSTASH_REDIS_REST_TOKEN
    secret: UPSTASH_REDIS_REST_TOKEN
    availability:
      - RUNTIME

  # Server credentials — Secret Manager only, never plain backend env.
  # BUILD too: lib/db/postgres.ts creates the pool at import time, and
  # `next build` imports route modules while collecting page data.
  - variable: DATABASE_URL
    secret: DATABASE_URL
    availability:
      - BUILD
      - RUNTIME
  - variable: SESSION_SECRET
    secret: SESSION_SECRET
    availability:
      - RUNTIME

  # Gemini drafts CMS copy and provisional feedback from recorded choices and answer keys.
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME

  # Firebase web config. Public by design (it ships in the client bundle) and
  # inlined at build time, so BUILD needs it as well as RUNTIME.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyB-8MugkLtJSYfQ0gVU02jWKr00bjOiC4E"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "novartis-decisionlab.firebaseapp.com"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "novartis-decisionlab"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "novartis-decisionlab.firebasestorage.app"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "604049405246"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:604049405246:web:834785e67dbed8a375286f"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: "G-2BKE72XB6H"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_DATABASE_URL
    value: "https://novartis-decisionlab-default-rtdb.firebaseio.com/"
    availability: [BUILD, RUNTIME]

  # Secrets live in Cloud Secret Manager; set them with
  # `firebase apphosting:secrets:set <name>` and grant the backend access with
  # `firebase apphosting:secrets:grantaccess <name> --backend novarquiz-website`.
  # See https://firebase.google.com/docs/app-hosting/configure#secret-parameters
