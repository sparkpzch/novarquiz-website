name: NovarquizContainers

services:
  NovartisDB:
    image: postgres:latest
    container_name: NovartisDB
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./db/migrations:/docker-entrypoint-migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-novarquiz_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  NovarquizAPI:
    image: node:latest
    container_name: NovarquizAPI
    restart: always
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      DB_PROVIDER: docker
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@NovartisDB:5432/${POSTGRES_DB:-novarquiz_db}"
    ports:
      - "8080:8080"
    depends_on:
      NovartisDB:
        condition: service_healthy
    command: sh -c "npm install && npx dotenv -e .env.local -- next build --webpack && npx dotenv -e .env.local -- next start -p 8080"

volumes:
  postgres_data:
