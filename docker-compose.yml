name: NovarquizContainers

services:
  NovartisDB:
    image: postgres:latest
    container_name: NovartisDB
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  NovarquizAPI:
    image: node:latest
    container_name: NovarquizAPI
    restart: always
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      - NovartisDB
    command: sh -c "npm install && npm run build && npm start -- -p 8080"

volumes:
  postgres_data:
